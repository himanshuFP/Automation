name: Maven CI

on:
  push:
    branches:
      - mainbranch
  pull_request:
    branches:
      - mainbranch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - run: mvn clean test